syntax = "proto3";

package emedical;

// ============================================================================
// E-Medical Booklet Blockchain Core gRPC IPC Service Definition
// ============================================================================


message InfoRequest {
    string message = 1;
}
message InfoResponse {
    string message = 1;
}

service BlockchainCoreService {
    rpc GetInfo(InfoRequest) returns (InfoResponse);
}
